<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Imposter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root {
    --bg: #262633;
    --panel: #10142d;
    --panel-alt: #1E2027;
    --line: #2A2C34;
    --text: #F2F1ED;
    --muted: #8B8D97;
    --amber: #E3A83D;
    --amber-dim: #B9822C;
    --rust: #D9503F;
    --teal: #3FBBA8;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100%;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font-family: inherit; }
  input::placeholder { color: var(--muted); opacity: 0.7; }
  p { margin: 0; }
  svg { display: inline-block; }

  .display { font-family: 'Space Grotesk', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  #app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 0 18px 32px;
    display: flex;
    flex-direction: column;
  }

  /* header */
  .header-bar { position: sticky; top: 0; background: var(--bg); padding: 16px 0 12px; display: flex; flex-direction: column; gap: 14px; z-index: 10; }
  .header-top { display: flex; align-items: center; justify-content: space-between; }
  .header-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; }
  .header-round { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); margin-left: 8px; }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; color: var(--muted); }

  .steps { display: flex; align-items: center; gap: 5px; }
  .step { height: 3px; flex: 1; border-radius: 2px; background: var(--line); transition: background .25s ease; }
  .step.done { background: var(--amber); }

  /* buttons */
  .btn-primary {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; border-radius: 12px; padding: 15px; font-size: 16px; font-weight: 600;
    background: var(--amber); color: #171207;
    font-family: 'Space Grotesk', sans-serif; transition: transform .1s, opacity .1s;
  }
  .btn-primary:active { transform: scale(.97); }
  .btn-primary:disabled { background: var(--panel-alt); color: var(--muted); }
  .btn-ghost {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; border-radius: 12px; padding: 13px; font-size: 15px; font-weight: 600;
    background: transparent; border: 1px solid var(--line); color: var(--text); font-family: 'Space Grotesk', sans-serif;
  }
  .btn-ghost:active { transform: scale(.97); }
  .btn-secondary { flex: 1; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600; background: var(--panel-alt); color: var(--text); font-family: 'Space Grotesk', sans-serif; }
  .btn-danger { flex: 1; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600; background: var(--rust); color: #1a0e0b; font-family: 'Space Grotesk', sans-serif; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border-radius: 8px; padding: 8px 13px; font-size: 13px; font-weight: 500; background: var(--panel-alt); color: var(--muted); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 7px; }
  .chip.active { background: var(--panel); color: var(--text); border-color: var(--amber); }
  .cat-dot { width: 7px; height: 7px; border-radius: 9999px; flex-shrink: 0; }

  .avatar { border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: 'Space Grotesk', sans-serif; flex-shrink: 0; }

  /* setup screen */
  .app-listing { display: flex; align-items: center; gap: 16px; padding-top: 26px; padding-bottom: 4px; }
  .app-icon { width: 60px; height: 60px; border-radius: 16px; flex-shrink: 0; background: var(--panel); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }
  .app-listing-text h1 { font-size: 27px; color: var(--text); font-weight: 700; letter-spacing: -0.01em; margin: 0; line-height: 1.15; }
  .app-listing-text .app-version { margin-top: 4px; font-size: 13px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .setup-tagline { padding-top: 16px; padding-bottom: 2px; font-size: 14px; color: var(--muted); line-height: 1.5; }

  .rules-toggle { display: flex; align-items: center; gap: 7px; justify-content: center; font-size: 13px; color: var(--teal); font-weight: 600; width: 100%; padding: 12px 0; }
  .rules-box { border-radius: 12px; padding: 16px; font-size: 13.5px; line-height: 1.75; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
  .rules-box p { margin: 4px 0; }
  .rules-divider { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .rules-divider .label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--amber); margin-bottom: 4px; }

  .section { margin-top: 26px; }
  .section-title { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }

  .player-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .player-input { flex: 1; border-radius: 10px; padding: 10px 12px; font-size: 14px; background: var(--panel); color: var(--text); border: 1px solid var(--line); outline: none; }
  .player-input:focus { border-color: var(--amber-dim); }
  .remove-btn { border-radius: 10px; padding: 9px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); display: flex; }
  .remove-btn:disabled { opacity: .3; }
  .setup-actions { display: flex; gap: 8px; margin-top: 8px; }
  .add-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; padding: 10px; background: var(--panel-alt); border: 1px solid var(--line); color: var(--text); font-weight: 600; font-size: 13.5px; }
  .add-btn:disabled { opacity: .5; }
  .funny-btn { display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; padding: 10px 14px; background: var(--panel-alt); border: 1px solid var(--line); color: var(--teal); font-weight: 600; font-size: 13.5px; white-space: nowrap; }

  .toggle-row { width: 100%; display: flex; align-items: center; justify-content: space-between; border-radius: 10px; padding: 13px 15px; background: var(--panel); border: 1px solid var(--line); text-align: left; }
  .toggle-text { padding-right: 12px; }
  .toggle-text .t1 { font-size: 14px; font-weight: 600; color: var(--text); }
  .toggle-text .t2 { font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .toggle { width: 42px; height: 24px; border-radius: 9999px; background: var(--line); position: relative; flex-shrink: 0; transition: background .2s; }
  .toggle.on { background: var(--teal); }
  .toggle-knob { width: 18px; height: 18px; border-radius: 9999px; background: var(--bg); position: absolute; top: 3px; left: 3px; transition: left .2s; }
  .toggle.on .toggle-knob { left: 21px; }

  /* stage */
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; padding: 34px 0; }

  .reveal-card { width: 100%; border-radius: 14px; padding: 30px 26px; display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
  .reveal-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .reveal-card.crew::before { background: var(--amber); }
  .reveal-card.imposter::before { background: var(--rust); }
  .reveal-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .reveal-label { font-size: 13.5px; color: var(--muted); }
  .reveal-word { font-size: 32px; font-weight: 700; color: var(--text); font-family: 'Space Grotesk', sans-serif; }
  .reveal-icon { color: var(--rust); }

  /* discussion */
  .timer-ring-wrap { display: flex; justify-content: center; padding: 6px 0; }
  .timer-ring { position: relative; width: 148px; height: 148px; }
  .timer-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 600; font-family: 'IBM Plex Mono', monospace; }
  .timer-controls { display: flex; gap: 8px; justify-content: center; }
  .timer-btn { display: flex; align-items: center; gap: 6px; border-radius: 10px; padding: 10px 15px; background: var(--panel-alt); border: 1px solid var(--line); color: var(--text); font-weight: 600; font-size: 13.5px; }

  /* scoreboard / podium */
  .scoreboard-box { border-radius: 12px; padding: 16px; background: var(--panel); border: 1px solid var(--line); }
  .scoreboard-box .label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .score-row { display: flex; align-items: center; gap: 12px; }
  .score-rank { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); width: 14px; }
  .score-name { flex: 1; font-size: 14px; font-weight: 600; color: var(--text); }
  .score-val { font-size: 14px; font-weight: 700; color: var(--amber); font-family: 'IBM Plex Mono', monospace; }

  .podium-row { display: flex; align-items: center; gap: 12px; border-radius: 12px; padding: 12px 16px; background: var(--panel); border: 1px solid var(--line); }
  .podium-row.first { border-color: var(--amber); }
  .podium-rank { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--muted); width: 18px; text-align: center; }
  .podium-name { flex: 1; font-size: 14px; font-weight: 700; color: var(--text); }
  .podium-score { font-size: 15px; font-weight: 700; color: var(--amber); font-family: 'IBM Plex Mono', monospace; }

  /* modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(6,6,8,.72); display: flex; align-items: flex-end; justify-content: center; padding: 16px; z-index: 50; }
  .modal-box { width: 100%; max-width: 420px; border-radius: 16px; padding: 20px; background: var(--panel); border: 1px solid var(--line); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .modal-title { font-size: 16px; font-weight: 600; color: var(--text); font-family: 'Space Grotesk', sans-serif; }
  .modal-close { border-radius: 9999px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: var(--panel-alt); color: var(--muted); }

  @keyframes floatIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .float-in { animation: floatIn .28s ease-out; }
  @keyframes pulseRing { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  .pulse { animation: pulseRing 1s ease-in-out infinite; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  // ---------- icon set (stroke-based, currentColor) ----------
  var ICONS = {
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    check: '<path d="M5 13l4.5 4.5L19 8"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    trash: '<path d="M4 7h16M9 7V4.6c0-.9.7-1.6 1.6-1.6h2.8c.9 0 1.6.7 1.6 1.6V7M6 7l.9 12.1c.07.9.83 1.6 1.73 1.6h6.74c.9 0 1.66-.7 1.73-1.6L18 7"/><path d="M10 11v6M14 11v6"/>',
    shuffle: '<path d="M4 6h3.2c1.3 0 2.6.7 3.2 1.8l2.2 3.7c.7 1.1 1.9 1.8 3.2 1.8H19"/><path d="M4 18h3.2c1.3 0 2.6-.7 3.2-1.8l.5-.8"/><path d="M16 6h3M16 18h3"/><path d="M17 3.5L20 6l-3 2.5M17 20.5l3-2.5-3-2.5"/>',
    info: '<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><circle cx="12" cy="8" r="0.7" fill="currentColor" stroke="none"/>',
    eye: '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.6"/>',
    refresh: '<path d="M20 11a8 8 0 1 0-1.5 5.7"/><path d="M20 4v7h-7"/>',
    play: '<path d="M7 4.8v14.4l12.5-7.2L7 4.8z"/>',
    pause: '<rect x="7" y="5" width="3.2" height="14" rx="1"/><rect x="13.8" y="5" width="3.2" height="14" rx="1"/>',
    trophy: '<path d="M7 4h10v3.5a5 5 0 0 1-10 0V4z"/><path d="M7 5H4.5A2.5 2.5 0 0 0 7 9.5"/><path d="M17 5h2.5A2.5 2.5 0 0 1 17 9.5"/><path d="M9.3 17.5h5.4M12 13.5v4"/><path d="M8.3 20.5h7.4"/>',
    crown: '<path d="M4 18l-1.3-9L7 12l5-6.5L17 12l4.3-3L20 18H4z"/>',
    chevronRight: '<path d="M9 5l7 7-7 7"/>',
    badge: '<path d="M12 2.3l7.4 3.5v6.3c0 4.7-3.2 8.1-7.4 9.7-4.2-1.6-7.4-5-7.4-9.7V5.8L12 2.3z"/><path d="M10.1 9.2c0-1.1 1-2 2.1-1.9 1.1.1 1.9.9 1.9 1.9 0 1-.6 1.4-1.3 1.9-.5.4-.8.8-.8 1.5" /><circle cx="12" cy="15.6" r="0.7" fill="currentColor" stroke="none"/>',
    users: '<circle cx="9" cy="8.2" r="3"/><path d="M3.2 19.5c0-3 2.6-5.2 5.8-5.2s5.8 2.2 5.8 5.2"/><circle cx="17.3" cy="9" r="2.3"/><path d="M15.3 14.6c2 .3 3.7 1.8 4.1 3.9"/>'
  };
  function icon(name, size, extraStyle) {
    size = size || 17;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex-shrink:0;' + (extraStyle || "") + '">' + ICONS[name] + '</svg>';
  }

  // ---------- data ----------
  var CATEGORIES = {
    Food: { words: ["Pizza","Sushi","Burger","Pasta","Tacos","Ice Cream","Pancakes","Sandwich","Curry","Dumplings","Popcorn","Chocolate","Cheese","Noodles","Salad","Donut","Waffles","Burrito","Ramen","Steak"] },
    Movies: { words: ["Titanic","Avatar","Inception","Frozen","Gladiator","Matrix","Jumanji","Rocky","Up","Coco","Shrek","Alien","Joker","Dune","Tenet","Grease","Cars","Ghostbusters","Twister"] },
    Places: { words: ["Beach","Mountain","Desert","Forest","Airport","Library","Museum","Stadium","Hospital","School","Castle","Volcano","Island","Cave","Bridge","Park","Zoo","Farm","Market","Lighthouse"] },
    Animals: { words: ["Elephant","Penguin","Kangaroo","Dolphin","Tiger","Giraffe","Octopus","Panda","Eagle","Shark","Rabbit","Wolf","Koala","Peacock","Cheetah","Owl","Camel","Turtle","Flamingo","Gorilla"] },
    Sports: { words: ["Soccer","Basketball","Tennis","Cricket","Swimming","Boxing","Golf","Volleyball","Rugby","Skiing","Surfing","Baseball","Hockey","Badminton","Archery","Cycling","Wrestling","Bowling","Gymnastics","Skateboarding"] },
    Objects: { words: ["Umbrella","Backpack","Telescope","Guitar","Camera","Bicycle","Candle","Mirror","Ladder","Balloon","Wallet","Headphones","Suitcase","Compass","Blanket","Scissors","Clock","Keyboard","Lantern","Trophy"] },
    Professions: { words: ["Doctor","Teacher","Chef","Pilot","Firefighter","Astronaut","Dentist","Plumber","Lawyer","Farmer","Photographer","Electrician","Nurse","Architect","Actor","Musician","Scientist","Journalist","Mechanic","Veterinarian"] },
    Countries: { words: ["USA","India","France","Japan","Brazil","Canada","Australia","Germany","Egypt","Mexico","Italy","Spain","China","Russia","Kenya","Argentina","Thailand","Greece","Norway","Turkey"] },
    School: { words: ["Backpack","Homework","Locker","Recess","Principal","Chalkboard","Pencil","Eraser","Report Card","Field Trip","Cafeteria","Detention","Yearbook","Graduation","Textbook","Whiteboard","Playground","Assembly","Lunchbox","School Bus"] },
    Vehicles: { words: ["Car","Truck","Motorcycle","Helicopter","Submarine","Train","Airplane","Scooter","Skateboard","Tractor","Ambulance","Taxi","Yacht","Canoe","Sailboat","Van","Jet","Rocket","Golf Cart","Bus"] },
    Emotions: { words: ["Happiness","Sadness","Anger","Surprise","Excitement","Boredom","Nervousness","Jealousy","Pride","Confusion","Relief","Curiosity","Gratitude","Embarrassment","Confidence","Joy","Disgust","Hope","Frustration","Awe"] },
    Instruments: { words: ["Piano","Violin","Drums","Trumpet","Saxophone","Flute","Cello","Harmonica","Ukulele","Xylophone","Accordion","Banjo","Clarinet","Trombone","Harp","Bagpipes","Tambourine","Maracas","Bassoon","Oboe"] },
    Weather: { words: ["Rainbow","Thunderstorm","Hurricane","Snowflake","Sunrise","Sunset","Tornado","Fog","Blizzard","Drought","Avalanche","Earthquake","Tsunami","Monsoon","Frost","Dew","Lightning","Cloud","Breeze","Heatwave"] },
    Drinks: { words: ["Coffee","Tea","Lemonade","Milkshake","Smoothie","Soda","Orange Juice","Hot Chocolate","Iced Tea","Coconut Water","Root Beer","Sparkling Water","Espresso","Cappuccino","Latte","Mocktail","Cider","Buttermilk","Milk","Lassi"] }
  };
  var CATEGORY_NAMES = Object.keys(CATEGORIES);

  var CAT_COLORS = ["#E3A83D", "#3FBBA8", "#D9503F", "#6C90C4", "#B98BC9", "#8FBF6C", "#D98BB0", "#C9A227", "#5FA8D3", "#C97B4A"];
  function catColor(cat) { return CAT_COLORS[CATEGORY_NAMES.indexOf(cat) % CAT_COLORS.length]; }

  var FUNNY_NAMES = [
    "Agent Avocado", "Sir Mix-a-Lot", "Captain Chaos", "Spicy Steve", "Ninja Nacho",
    "Lady Shenanigans", "Doctor Doodle", "Mister Sparkles", "Frisky Business", "Big Poppa Waffles",
    "Sneaky Pete", "Madame Mystery", "The Great Gouda", "Turbo Tina", "Zero Cool"
  ];

  var AVATAR_COLORS = ["#E3A83D", "#3FBBA8", "#D9503F", "#6C90C4", "#B98BC9", "#8FBF6C", "#D98BB0", "#C9A227"];
  var TIMER_OPTIONS = [5, 10, 15, 20, 30];

  var APP_ICON_SVG = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="' + CAT_COLORS[0] + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + ICONS.badge + '</svg>';

  // ---------- helpers ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function avatarColor(id) { return AVATAR_COLORS[id % AVATAR_COLORS.length]; }
  function initials(name) {
    var n = (name || "").trim();
    return n ? n.charAt(0).toUpperCase() : "?";
  }
  function fmtTime(s) {
    var m = Math.floor(s / 60), sec = s % 60;
    return m + ":" + String(sec).padStart(2, "0");
  }
  function avatarHtml(name, id, size) {
    size = size || 42;
    var fontSize = Math.round(size * 0.4);
    return '<div class="avatar" id="avatar-' + id + '" style="width:' + size + 'px;height:' + size + 'px;background:' + avatarColor(id) + ';color:#171207;font-size:' + fontSize + 'px;">' + esc(initials(name)) + '</div>';
  }

  // ---------- state ----------
  var state = {
    phase: "setup",
    players: [
      { id: 1, name: "", score: 0 }, { id: 2, name: "", score: 0 },
      { id: 3, name: "", score: 0 }, { id: 4, name: "", score: 0 }
    ],
    nextId: 5,
    selectedCats: CATEGORY_NAMES.slice(),
    decoyEnabled: false,
    discussionLen: 600,
    showRules: false,
    showScoreboard: false,
    showQuitConfirm: false,
    round: 0,
    usedWords: [],
    secretWord: null,
    secretCategory: null,
    imposterIndex: null,
    decoyWord: null,
    revealIndex: 0,
    revealShown: false,
    timeLeft: 600,
    timerRunning: false,
    roundOutcome: null
  };

  // ---------- setup helpers ----------
  function addPlayer() {
    if (state.players.length >= 15) return;
    state.players.push({ id: state.nextId++, name: "", score: 0 });
    render();
  }
  function removePlayer(id) {
    if (state.players.length <= 4) return;
    state.players = state.players.filter(function (p) { return p.id !== id; });
    render();
  }
  function fillFunnyNames() {
    var pool = shuffle(FUNNY_NAMES), i = 0;
    state.players = state.players.map(function (p) {
      if (p.name.trim()) return p;
      var np = { id: p.id, name: pool[i % pool.length], score: p.score };
      i++;
      return np;
    });
    render();
  }
  function toggleCategory(cat) {
    if (state.selectedCats.indexOf(cat) !== -1) {
      if (state.selectedCats.length > 1) state.selectedCats = state.selectedCats.filter(function (c) { return c !== cat; });
    } else {
      state.selectedCats = state.selectedCats.concat([cat]);
    }
    render();
  }

  // ---------- round engine ----------
  function buildPool() {
    var pool = [];
    state.selectedCats.forEach(function (cat) {
      CATEGORIES[cat].words.forEach(function (w) { pool.push({ word: w, category: cat }); });
    });
    return pool;
  }

  function beginRound(roundNum) {
    var pool = buildPool();
    var available = pool.filter(function (p) { return state.usedWords.indexOf(p.word) === -1; });
    var newUsed = state.usedWords;
    if (available.length === 0) { available = pool; newUsed = []; }
    var pick = available[Math.floor(Math.random() * available.length)];
    newUsed = newUsed.concat([pick.word]);
    state.usedWords = newUsed;
    state.secretWord = pick.word;
    state.secretCategory = pick.category;

    state.imposterIndex = Math.floor(Math.random() * state.players.length);

    if (state.decoyEnabled) {
      var decoyPool = pool.filter(function (p) { return p.word !== pick.word; });
      var d = decoyPool[Math.floor(Math.random() * decoyPool.length)];
      state.decoyWord = d.word;
    } else {
      state.decoyWord = null;
    }

    state.revealIndex = 0;
    state.revealShown = false;

    state.timeLeft = state.discussionLen;
    state.timerRunning = false;
    state.roundOutcome = null;

    state.phase = "reveal";
    render();
  }

  function startGame() {
    state.players = state.players.map(function (p, i) {
      return { id: p.id, name: p.name.trim() || ("Player " + (i + 1)), score: 0 };
    });
    state.usedWords = [];
    state.round = 0;
    beginRound(0);
  }
  function nextRound() { state.round += 1; beginRound(state.round); }
  function playAgainSameCrew() {
    state.players = state.players.map(function (p) { return { id: p.id, name: p.name, score: 0 }; });
    state.usedWords = [];
    state.round = 0;
    beginRound(0);
  }
  function fullReset() {
    state.players = [
      { id: 1, name: "", score: 0 }, { id: 2, name: "", score: 0 },
      { id: 3, name: "", score: 0 }, { id: 4, name: "", score: 0 }
    ];
    state.nextId = 5;
    state.usedWords = [];
    state.round = 0;
    state.phase = "setup";
    state.showQuitConfirm = false;
    render();
  }

  // ---------- reveal ----------
  function revealShow() { state.revealShown = true; render(); }
  function nextRevealPlayer() { state.revealShown = false; state.revealIndex += 1; render(); }

  // ---------- discussion -> reveal ----------
  function endDiscussion() {
    state.timerRunning = false;
    state.phase = "imposterReveal";
    render();
  }

  // ---------- outcome ----------
  function finalizeCrewWin() {
    var imp = state.players[state.imposterIndex];
    state.players = state.players.map(function (p) {
      return p.id === imp.id ? p : { id: p.id, name: p.name, score: p.score + 1 };
    });
    state.roundOutcome = { type: "crewWin" };
    state.phase = "roundEnd";
    render();
  }
  function finalizeImposterWin() {
    var imp = state.players[state.imposterIndex];
    state.players = state.players.map(function (p) {
      return p.id === imp.id ? { id: p.id, name: p.name, score: p.score + 2 } : p;
    });
    state.roundOutcome = { type: "imposterWin" };
    state.phase = "roundEnd";
    render();
  }

  // ---------- timer loop ----------
  setInterval(function () {
    if (state.phase === "discussion" && state.timerRunning) {
      if (state.timeLeft <= 0) { state.timerRunning = false; render(); return; }
      state.timeLeft -= 1;
      render();
    }
  }, 1000);

  // ---------- render: header ----------
  function renderDots() {
    var map = { reveal: 0, discussion: 1, imposterReveal: 2 };
    var idx = map[state.phase];
    if (idx === undefined) return "";
    var html = '<div class="steps">';
    for (var i = 0; i < 3; i++) {
      html += '<div class="step ' + (i <= idx ? "done" : "") + '"></div>';
    }
    return html + "</div>";
  }
  function renderHeader() {
    var cat = state.secretCategory || "";
    return '' +
      '<div class="header-bar">' +
        '<div class="header-top">' +
          '<div style="display:flex;align-items:center;">' +
            '<span class="header-tag">' + esc(cat.toUpperCase()) + '</span>' +
            '<span class="header-round">ROUND ' + (state.round + 1) + '</span>' +
          '</div>' +
          '<div class="header-actions">' +
            '<button class="icon-btn" data-action="open-scoreboard">' + icon("trophy", 15) + '</button>' +
            '<button class="icon-btn" data-action="open-quit">' + icon("close", 15) + '</button>' +
          '</div>' +
        '</div>' +
        renderDots() +
      '</div>';
  }

  // ---------- render: setup ----------
  function renderSetup() {
    var html = '' +
      '<div class="app-listing">' +
        '<div class="app-icon">' + APP_ICON_SVG + '</div>' +
        '<div class="app-listing-text">' +
          '<h1 class="display">Imposter</h1>' +
          '<p class="app-version">  Local party game</p>' +
        '</div>' +
      '</div>' +
      '<div class="setup-tagline">' +
        '<p>One of you doesn\'t know the word. Find them before they figure it out.</p>' +
      '</div>' +
      '<button class="rules-toggle" data-action="toggle-rules">' + icon("info", 15) + ' ' + (state.showRules ? "Hide how to play" : "How to play") + '</button>';

    if (state.showRules) {
      html += '' +
        '<div class="rules-box float-in">' +
          '<p>&middot; Everyone except the Imposter gets the same secret word.</p>' +
          '<p>&middot; Discuss out loud for the timer &mdash; ask questions, drop hints, size each other up.</p>' +
          '<p>&middot; When you\'re ready, end the discussion to reveal who the Imposter was.</p>' +
          '<p>&middot; If the group figures out the Imposter, the crew wins the round.</p>' +
          '<p>&middot; If the Imposter fools everyone, they win the round.</p>' +
          '<div class="rules-divider">' +
            '<p class="label">Scoring</p>' +
            '<p>Imposter caught: +1 each crew member. Imposter not caught: +2 Imposter.</p>' +
          '</div>' +
        '</div>';
    }

    html += '<div class="section"><div class="section-title"><span>Players &mdash; ' + state.players.length + '</span></div><div>';
    state.players.forEach(function (p, i) {
      html += '' +
        '<div class="player-row">' +
          avatarHtml(p.name || String(i + 1), p.id, 38) +
          '<input class="player-input" data-bind="player-name" data-id="' + p.id + '" data-fallback="' + (i + 1) + '" value="' + esc(p.name) + '" placeholder="Player ' + (i + 1) + '" maxlength="18" />' +
          '<button class="remove-btn" data-action="remove-player" data-id="' + p.id + '" ' + (state.players.length <= 4 ? "disabled" : "") + '>' + icon("trash", 15) + '</button>' +
        '</div>';
    });
    html += '</div><div class="setup-actions">' +
      '<button class="add-btn" data-action="add-player" ' + (state.players.length >= 15 ? "disabled" : "") + '>' + icon("plus", 15) + ' Add player' + (state.players.length >= 15 ? " (max 15)" : "") + '</button>' +
      '<button class="funny-btn" data-action="fill-funny">' + icon("shuffle", 15) + ' Shuffle names</button>' +
    '</div></div>';

    html += '<div class="section"><div class="section-title"><span>Categories &mdash; ' + state.selectedCats.length + ' of ' + CATEGORY_NAMES.length + '</span></div><div class="chip-row">';
    CATEGORY_NAMES.forEach(function (cat) {
      var active = state.selectedCats.indexOf(cat) !== -1;
      html += '<button class="chip ' + (active ? "active" : "") + '" data-action="toggle-cat" data-id="' + cat + '"><span class="cat-dot" style="background:' + catColor(cat) + ';"></span>' + cat + '</button>';
    });
    html += '</div></div>';

    html += '' +
      '<div class="section">' +
        '<div class="section-title"><span>Discussion timer</span></div>' +
        '<div class="chip-row" style="margin-bottom:16px;">';
    TIMER_OPTIONS.forEach(function (t) {
      html += '<button class="chip ' + (state.discussionLen === t * 60 ? "active" : "") + '" data-action="set-timer-len" data-id="' + t + '">' + t + ' min</button>';
    });
    html += '</div>' +
        '<button class="toggle-row" data-action="toggle-decoy">' +
          '<div class="toggle-text">' +
            '<div class="t1">Decoy word for the Imposter</div>' +
            '<div class="t2">Harder mode &mdash; the Imposter gets a different word instead of being told outright.</div>' +
          '</div>' +
          '<div class="toggle ' + (state.decoyEnabled ? "on" : "") + '"><div class="toggle-knob"></div></div>' +
        '</button>' +
      '</div>';

    html += '<div class="section"><button class="btn-primary" data-action="start-game">Start Game</button></div>';
    return html;
  }

  // ---------- render: reveal ----------
  function renderReveal() {
    if (state.revealIndex >= state.players.length) {
      return '' +
        '<div class="stage float-in">' +
          '<div style="color:var(--muted);">' + icon("badge", 40) + '</div>' +
          '<h2 class="display" style="font-size:24px;font-weight:600;">Everyone knows their role</h2>' +
          '<p style="color:var(--muted);max-width:280px;">Talk it out, ask questions, and try to spot who\'s faking it.</p>' +
          '<div style="width:100%;"><button class="btn-primary" data-action="start-discussion">Start Discussion</button></div>' +
        '</div>';
    }
    var current = state.players[state.revealIndex];
    var isImposter = state.revealIndex === state.imposterIndex;

    if (!state.revealShown) {
      return '' +
        '<div class="stage float-in">' +
          avatarHtml(current.name, current.id, 80) +
          '<div><p style="color:var(--muted);font-size:13.5px;">Pass the phone to</p>' +
          '<h2 class="display" style="font-size:27px;font-weight:700;margin-top:4px;">' + esc(current.name) + '</h2></div>' +
          '<p style="color:var(--muted);font-size:12px;" class="mono">' + (state.revealIndex + 1) + ' / ' + state.players.length + '</p>' +
          '<div style="width:100%;"><button class="btn-primary" data-action="reveal-show">' + icon("eye", 17) + ' Reveal my word</button></div>' +
        '</div>';
    }

    var showAsCrew = !isImposter || state.decoyEnabled;
    var displayWord = (isImposter && state.decoyEnabled) ? state.decoyWord : state.secretWord;
    var inner = showAsCrew ? ('' +
        '<p class="reveal-tag mono">' + esc(state.secretCategory.toUpperCase()) + '</p>' +
        '<p class="reveal-label">Your word</p>' +
        '<h2 class="reveal-word">' + esc(displayWord) + '</h2>'
      ) : ('' +
        '<div class="reveal-icon">' + icon("badge", 38) + '</div>' +
        '<h2 class="reveal-word" style="font-size:24px;">You\'re the Imposter</h2>' +
        '<p style="font-size:13.5px;color:var(--muted);">Nobody can know. Listen closely, and try to work out the real word from the discussion.</p>'
      );

    return '' +
      '<div class="stage float-in" style="padding-top:18px;">' +
        '<div class="reveal-card ' + (showAsCrew ? "crew" : "imposter") + '">' + inner + '</div>' +
        '<div style="width:100%;"><button class="btn-primary" data-action="reveal-next">' + icon("check", 17) + ' Hide &amp; pass it on</button></div>' +
      '</div>';
  }

  // ---------- render: discussion ----------
  function renderDiscussion() {
    var radius = 60, circumference = 2 * Math.PI * radius;
    var ratio = state.discussionLen > 0 ? Math.max(0, state.timeLeft / state.discussionLen) : 0;
    var dashoffset = circumference * (1 - ratio);
    var ringColor = ratio > 0.2 ? "var(--amber)" : "var(--rust)";
    var lowTime = state.timerRunning && state.timeLeft <= 10 && state.timeLeft > 0;

    var html = '' +
      '<div style="flex:1;display:flex;flex-direction:column;gap:22px;padding:20px 0;">' +
        '<div style="text-align:center;">' +
          '<h2 class="display" style="font-size:22px;font-weight:600;">Discussion</h2>' +
          '<p style="color:var(--muted);margin-top:4px;font-size:13.5px;">Who do you think is the Imposter?</p>' +
        '</div>' +
        '<div class="timer-ring-wrap"><div class="timer-ring ' + (lowTime ? "pulse" : "") + '">' +
          '<svg width="148" height="148" viewBox="0 0 148 148">' +
            '<circle cx="74" cy="74" r="' + radius + '" fill="none" stroke="var(--line)" stroke-width="7" />' +
            '<circle cx="74" cy="74" r="' + radius + '" fill="none" stroke="' + ringColor + '" stroke-width="7" ' +
              'stroke-dasharray="' + circumference + '" stroke-dashoffset="' + dashoffset + '" stroke-linecap="round" ' +
              'transform="rotate(-90 74 74)" style="transition:stroke-dashoffset 1s linear, stroke .3s;" />' +
          '</svg>' +
          '<div class="timer-num">' + fmtTime(state.timeLeft) + '</div>' +
        '</div></div>' +
        '<div class="timer-controls">' +
          '<button class="timer-btn" data-action="timer-toggle">' + (state.timerRunning ? icon("pause", 15) + " Pause" : icon("play", 15) + " Start") + '</button>' +
          '<button class="timer-btn" data-action="timer-reset">' + icon("refresh", 15) + ' Reset</button>' +
          '<button class="timer-btn" data-action="timer-add5">+5 min</button>' +
        '</div>' +
        '<div style="margin-top:auto;"><button class="btn-primary" data-action="end-discussion">End Discussion &amp; Reveal</button></div>' +
      '</div>';
    return html;
  }

  // ---------- render: imposter reveal ----------
  function renderImposterReveal() {
    var imposter = state.players[state.imposterIndex];
    return '' +
      '<div class="stage float-in" style="padding-top:18px;">' +
        '<div class="reveal-card imposter">' +
          '<div class="reveal-icon">' + icon("badge", 34) + '</div>' +
          '<p class="reveal-label">The Imposter was</p>' +
          '<h2 class="reveal-word" style="font-size:28px;">' + esc(imposter.name) + '</h2>' +
        '</div>' +
        '<div class="reveal-card crew" style="padding:22px 26px;">' +
          '<p class="reveal-tag mono">' + esc(state.secretCategory.toUpperCase()) + '</p>' +
          '<p class="reveal-label">The word was</p>' +
          '<h2 class="reveal-word" style="font-size:24px;">' + esc(state.secretWord) + '</h2>' +
        '</div>' +
        '<p style="color:var(--muted);max-width:280px;">Did the group figure out who it was?</p>' +
        '<div style="width:100%;display:flex;flex-direction:column;gap:12px;">' +
          '<button class="btn-primary" data-action="finalize-crew">' + icon("check", 17) + ' We caught them</button>' +
          '<button class="btn-ghost" data-action="finalize-imposter">They fooled us</button>' +
        '</div>' +
      '</div>';
  }

  // ---------- render: round end ----------
  function renderRoundEnd() {
    var imposter = state.players[state.imposterIndex];
    var headline = "", sub = "";
    if (state.roundOutcome && state.roundOutcome.type === "crewWin") {
      headline = "Crew wins the round";
      sub = esc(imposter.name) + ' was the Imposter, and you caught them. The word was "' + esc(state.secretWord) + '".';
    } else if (state.roundOutcome && state.roundOutcome.type === "imposterWin") {
      headline = "Imposter wins the round";
      sub = esc(imposter.name) + ' fooled everyone. The word was "' + esc(state.secretWord) + '".';
    }
    var accent = (state.roundOutcome && state.roundOutcome.type === "crewWin") ? "var(--amber)" : "var(--rust)";

    var sorted = state.players.slice().sort(function (a, b) { return b.score - a.score; });
    var scoreRows = "";
    sorted.forEach(function (p, i) {
      scoreRows += '' +
        '<div class="score-row"><span class="score-rank">' + (i + 1) + '</span>' + avatarHtml(p.name, p.id, 30) +
          '<span class="score-name">' + esc(p.name) + '</span><span class="score-val">' + p.score + '</span></div>';
    });

    return '' +
      '<div style="flex:1;display:flex;flex-direction:column;gap:22px;padding:20px 0;">' +
        '<div style="text-align:center;">' +
          '<h2 class="display" style="font-size:23px;color:' + accent + ';font-weight:700;">' + headline + '</h2>' +
          '<p style="color:var(--muted);margin-top:8px;max-width:280px;margin-left:auto;margin-right:auto;font-size:13.5px;">' + sub + '</p>' +
        '</div>' +
        '<div class="scoreboard-box"><p class="label">Scoreboard</p><div style="display:flex;flex-direction:column;gap:8px;">' + scoreRows + '</div></div>' +
        '<div style="margin-top:auto;display:flex;flex-direction:column;gap:12px;">' +
          '<button class="btn-primary" data-action="next-round">Next Round</button>' +
          '<button class="btn-ghost" data-action="end-session">' + icon("trophy", 16) + ' End Session</button>' +
        '</div>' +
      '</div>';
  }

  // ---------- render: podium ----------
  function renderPodium() {
    var sorted = state.players.slice().sort(function (a, b) { return b.score - a.score; });
    var rows = "";
    sorted.forEach(function (p, i) {
      rows += '' +
        '<div class="podium-row ' + (i === 0 ? "first" : "") + '">' +
          (i === 0 ? '<span style="color:var(--amber);">' + icon("crown", 18) + '</span>' : '<span class="podium-rank">' + (i + 1) + '</span>') +
          avatarHtml(p.name, p.id, 34) +
          '<span class="podium-name">' + esc(p.name) + '</span><span class="podium-score">' + p.score + '</span>' +
        '</div>';
    });
    return '' +
      '<div style="flex:1;display:flex;flex-direction:column;gap:18px;padding:30px 0;align-items:center;">' +
        '<div style="color:var(--amber);">' + icon("trophy", 34) + '</div>' +
        '<h2 class="display" style="font-size:26px;font-weight:700;">Final Standings</h2>' +
        '<div style="width:100%;display:flex;flex-direction:column;gap:8px;">' + rows + '</div>' +
        '<p style="color:var(--muted);text-align:center;max-width:280px;font-size:13.5px;">Go again? The Imposter is already plotting a comeback.</p>' +
        '<div style="width:100%;display:flex;flex-direction:column;gap:12px;margin-top:auto;">' +
          '<button class="btn-primary" data-action="play-again">Play Again &mdash; Same Crew</button>' +
          '<button class="btn-ghost" data-action="new-players">' + icon("users", 16) + ' New Players</button>' +
        '</div>' +
      '</div>';
  }

  // ---------- render: modals ----------
  function renderScoreboardModal() {
    var sorted = state.players.slice().sort(function (a, b) { return b.score - a.score; });
    var rows = "";
    sorted.forEach(function (p, i) {
      rows += '' +
        '<div class="score-row"><span class="score-rank">' + (i + 1) + '</span>' + avatarHtml(p.name, p.id, 30) +
          '<span class="score-name">' + esc(p.name) + '</span><span class="score-val">' + p.score + '</span></div>';
    });
    return '' +
      '<div class="modal-overlay" data-action="close-scoreboard">' +
        '<div class="modal-box float-in" data-stop="1">' +
          '<div class="modal-head"><span class="modal-title">Scoreboard</span><button class="modal-close" data-action="close-scoreboard">' + icon("close", 14) + '</button></div>' +
          '<div style="display:flex;flex-direction:column;gap:8px;">' + rows + '</div>' +
        '</div>' +
      '</div>';
  }
  function renderQuitModal() {
    return '' +
      '<div class="modal-overlay" data-action="close-quit">' +
        '<div class="modal-box float-in" data-stop="1">' +
          '<div class="modal-head"><span class="modal-title">Quit to setup?</span><button class="modal-close" data-action="close-quit">' + icon("close", 14) + '</button></div>' +
          '<p style="color:var(--muted);margin-bottom:16px;font-size:13.5px;">This ends the current game and clears scores.</p>' +
          '<div style="display:flex;gap:12px;">' +
            '<button class="btn-secondary" data-action="close-quit">Cancel</button>' +
            '<button class="btn-danger" data-action="confirm-quit">Quit</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  // ---------- main render ----------
  function renderPhase() {
    switch (state.phase) {
      case "setup": return renderSetup();
      case "reveal": return renderReveal();
      case "discussion": return renderDiscussion();
      case "imposterReveal": return renderImposterReveal();
      case "roundEnd": return renderRoundEnd();
      case "podium": return renderPodium();
      default: return "";
    }
  }

  function render() {
    var app = document.getElementById("app");
    var showHeader = state.phase !== "setup" && state.phase !== "podium";
    var html = (showHeader ? renderHeader() : "") + renderPhase();
    if (state.showScoreboard) html += renderScoreboardModal();
    if (state.showQuitConfirm) html += renderQuitModal();
    app.innerHTML = html;
  }

  // ---------- actions ----------
  function handleAction(action, id) {
    switch (action) {
      case "toggle-rules": state.showRules = !state.showRules; render(); break;
      case "add-player": addPlayer(); break;
      case "remove-player": removePlayer(Number(id)); break;
      case "fill-funny": fillFunnyNames(); break;
      case "toggle-cat": toggleCategory(id); break;
      case "set-timer-len": state.discussionLen = Number(id) * 60; render(); break;
      case "toggle-decoy": state.decoyEnabled = !state.decoyEnabled; render(); break;
      case "start-game": startGame(); break;
      case "reveal-show": revealShow(); break;
      case "reveal-next": nextRevealPlayer(); break;
      case "start-discussion": state.phase = "discussion"; render(); break;
      case "timer-toggle": state.timerRunning = !state.timerRunning; render(); break;
      case "timer-reset": state.timeLeft = state.discussionLen; render(); break;
      case "timer-add5": state.timeLeft += 300; render(); break;
      case "end-discussion": endDiscussion(); break;
      case "finalize-crew": finalizeCrewWin(); break;
      case "finalize-imposter": finalizeImposterWin(); break;
      case "next-round": nextRound(); break;
      case "end-session": state.phase = "podium"; render(); break;
      case "play-again": playAgainSameCrew(); break;
      case "new-players": fullReset(); break;
      case "open-scoreboard": state.showScoreboard = true; render(); break;
      case "close-scoreboard": state.showScoreboard = false; render(); break;
      case "open-quit": state.showQuitConfirm = true; render(); break;
      case "confirm-quit": fullReset(); break;
    }
  }

  // ---------- event delegation ----------
  var app = document.getElementById("app");

  app.addEventListener("click", function (e) {
    var stopBox = e.target.closest('[data-stop]');
    var overlay = e.target.closest('.modal-overlay');
    var el = e.target.closest("[data-action]");
    if (!el) return;
    if (overlay && stopBox && stopBox.contains(e.target) && el === overlay) return;
    handleAction(el.dataset.action, el.dataset.id);
  });

  app.addEventListener("input", function (e) {
    var el = e.target;
    if (el.dataset.bind === "player-name") {
      var id = Number(el.dataset.id);
      var p = state.players.filter(function (pl) { return pl.id === id; })[0];
      if (p) {
        p.name = el.value;
        var av = document.getElementById("avatar-" + id);
        if (av) av.textContent = el.value.trim() ? initials(el.value) : el.dataset.fallback;
      }
    }
  });

  render();
})();
</script>
</body>
</html>
